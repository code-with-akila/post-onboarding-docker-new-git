name: ECS Deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION1: us-east-1          # ECS region
  ECR_REPOSITORY: post-onboarding-docker
  ECS_CLUSTER: post-onboarding-ecs
  ECS_SERVICE: post-onboarding-service
  TASK_FAMILY: post-onboarding-task

jobs:
  ecs-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION1 }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        run: |
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION1 }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest"
          echo "IMAGE_URI=$IMAGE_URI"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Register ECS Task Definition
        run: |
          sed -i "s|<IMAGE_URI>|${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION1 }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest|g" ecs-task-definition.json
          aws ecs register-task-definition \
            --cli-input-json file://ecs-task-definition.json \
            --region ${{ env.AWS_REGION1 }}

      - name: Deploy to ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION1 }}

